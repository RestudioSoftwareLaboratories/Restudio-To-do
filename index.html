<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Restudio To Do</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/JzYGnt17/restudio-profile.png">
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
        style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
        font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;
        img-src 'self' https://i.postimg.cc data:;
        connect-src 'self';
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">
    
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
    <!-- Tiny5 Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Full Width Top Bar - Fixed at top -->
    <div class="top-bar">
        <img src="https://i.postimg.cc/LXvCQ5rt/swrh-restudio.png" alt="Logo">
        <span class="brand-name">To Do</span>
    </div>

    <!-- Main Container -->
    <div class="container">
        <h1>
            <i class="ti ti-checklist"></i>
            My Tasks
        </h1>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="all">
                <i class="ti ti-list"></i>
                All
                <span class="tab-count" id="allCount">0</span>
            </button>
            <button class="tab" data-tab="favorites">
                <i class="ti ti-star"></i>
                Favorites
                <span class="tab-count" id="favCount">0</span>
            </button>
        </div>

        <!-- Input -->
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Add a new task..." />
            <button type="button" id="addBtn">
                <i class="ti ti-plus"></i>
            </button>
        </div>
        <div id="errorMsg" class="error-msg">
            <i class="ti ti-alert-circle"></i>
            Please enter a task
        </div>

        <!-- Task List -->
        <ul id="taskList">
            <li class="empty-state">
                <div class="empty-state-content">
                    <img src="https://i.postimg.cc/dtCPWmVs/task.png" alt="No tasks" class="empty-image" />
                    <div>
                        <div class="empty-text">No tasks yet</div>
                        <div class="empty-subtext">Add a new task to get started</div>
                    </div>
                </div>
            </li>
        </ul>

        <!-- Stats -->
        <div class="stats">
            <span id="taskCount" class="task-count-text">
                <i class="ti ti-list-numbers"></i>
                0 tasks
            </span>
            <button type="button" id="clearBtn">
                <i class="ti ti-trash"></i>
                Clear All
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
